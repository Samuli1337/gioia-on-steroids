<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" width="1000" height="494" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16191f">
<title>The pipeline for generating 2nd-order themes and aggregate dimensions</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<desc>Step 4, building 2nd-order themes: input, then reasoning model processing loop. Step 5, concept integration: concept similarity check, then semantic overlap check. Step 6, aggregation and finalization: build aggregate dimensions, then final output.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#16191f"/></marker></defs>
<rect x="16" y="16" width="666" height="214" fill="#f4f5f7" stroke="#d5d9df" stroke-width="1"/>
<text x="30" y="43" font-size="11" font-weight="700" letter-spacing="0.8" fill="#5d6470">STEP 4</text>
<text x="91.4222" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Building 2nd-order themes</text>
<rect x="16" y="246" width="666" height="232" fill="#f4f5f7" stroke="#d5d9df" stroke-width="1"/>
<text x="30" y="273" font-size="11" font-weight="700" letter-spacing="0.8" fill="#5d6470">STEP 6</text>
<text x="91.4222" y="273" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Aggregation and finalization</text>
<rect x="698" y="16" width="286" height="462" fill="#f4f5f7" stroke="#d5d9df" stroke-width="1"/>
<text x="712" y="43" font-size="11" font-weight="700" letter-spacing="0.8" fill="#5d6470">STEP 5</text>
<text x="773.422" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Concept integration</text>
<rect x="30" y="58" width="253" height="158" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="44" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Input</text>
<text x="44" y="108" font-size="13" fill="#5d6470">1.</text>
<text x="61" y="108" font-size="13">1st-order concepts with their</text>
<text x="61" y="126" font-size="13">supporting quotes and definitions</text>
<text x="44" y="147" font-size="13" fill="#5d6470">2.</text>
<text x="61" y="147" font-size="13">Research context</text>
<text x="44" y="168" font-size="13" fill="#5d6470">3.</text>
<text x="61" y="168" font-size="13">The Gioia method guide</text>
<rect x="313" y="58" width="355" height="158" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="327" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Reasoning model processing loop</text>
<text x="327" y="108" font-size="13">Group related 1st-order concepts into 2nd-order</text>
<text x="327" y="126" font-size="13">themes. The prompt encourages to consider in the</text>
<text x="327" y="144" font-size="13">grouping the concept boundaries. Run as a loop</text>
<text x="327" y="162" font-size="13">refining the 2nd-order layer until all 1st-order concepts</text>
<text x="327" y="180" font-size="13">are connected. All 2nd-order themes are given a</text>
<text x="327" y="198" font-size="13">definition.</text>
<rect x="30" y="288" width="253" height="176" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="44" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Final output</text>
<text x="44" y="338" font-size="13">An interactive graph with 1st-order</text>
<text x="44" y="356" font-size="13">concepts, 2nd-order themes and</text>
<text x="44" y="374" font-size="13">aggregate dimensions, and</text>
<text x="44" y="392" font-size="13">definitions for them all. A codebook</text>
<text x="44" y="410" font-size="13">and a list of changes and decisions</text>
<text x="44" y="428" font-size="13">that reasoning models made.</text>
<rect x="313" y="288" width="355" height="176" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="327" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Build aggregate dimensions</text>
<text x="327" y="338" font-size="13">Prompt reasoning model to distill related 2nd-order</text>
<text x="327" y="356" font-size="13">themes into aggregate dimensions. Option to provide</text>
<text x="327" y="374" font-size="13">theoretical frames as context, or even prompt a</text>
<text x="327" y="392" font-size="13">reasoning model to search for adequate existing</text>
<text x="327" y="410" font-size="13">theoretical frames to connect the findings to. Revise</text>
<text x="327" y="428" font-size="13">and iterate until all themes are connected to at least</text>
<text x="327" y="446" font-size="13">one aggregate dimension.</text>
<rect x="712" y="58" width="258" height="158" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="726" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Concept similarity check</text>
<text x="726" y="108" font-size="13">Run another reasoning model going</text>
<text x="726" y="126" font-size="13">through the 2nd-order themes and</text>
<text x="726" y="144" font-size="13">related quotes, and combine similar</text>
<text x="726" y="162" font-size="13">themes together.</text>
<rect x="712" y="288" width="258" height="176" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="726" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Semantic overlap check</text>
<text x="726" y="338" font-size="13">Run another reasoning model to</text>
<text x="726" y="356" font-size="13">check the final set of themes. Return</text>
<text x="726" y="374" font-size="13">the pipeline to Step 4 with memos of</text>
<text x="726" y="392" font-size="13">what went wrong in case issues are</text>
<text x="726" y="410" font-size="13">found.</text>
<line x1="283" y1="137" x2="313" y2="137" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="668" y1="137" x2="712" y2="137" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="841" y1="216" x2="841" y2="288" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="712" y1="376" x2="668" y2="376" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="313" y1="376" x2="283" y2="376" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
