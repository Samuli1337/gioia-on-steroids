<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 538" width="1000" height="538" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16191f">
<title>The pipeline for extracting 1st-order concepts</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<desc>Step 1, initial processing: input, reasoning model processing loop, intermediary output. Step 2, quality checks: hallucination check, then quotes match and leading questions checks. Step 3, merging concepts and finalization: merge 1st-order concepts with similar conceptual meaning, then final output.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#16191f"/></marker></defs>
<rect x="16" y="16" width="666" height="256" fill="#f4f5f7" stroke="#d5d9df" stroke-width="1"/>
<text x="30" y="43" font-size="11" font-weight="700" letter-spacing="0.8" fill="#5d6470">STEP 1</text>
<text x="91.4222" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Initial processing</text>
<rect x="16" y="288" width="666" height="234" fill="#f4f5f7" stroke="#d5d9df" stroke-width="1"/>
<text x="30" y="315" font-size="11" font-weight="700" letter-spacing="0.8" fill="#5d6470">STEP 3</text>
<text x="91.4222" y="315" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Merging concepts and finalization</text>
<rect x="698" y="16" width="286" height="506" fill="#f4f5f7" stroke="#d5d9df" stroke-width="1"/>
<text x="712" y="43" font-size="11" font-weight="700" letter-spacing="0.8" fill="#5d6470">STEP 2</text>
<text x="773.422" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Quality checks</text>
<rect x="30" y="58" width="166" height="200" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="44" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Input</text>
<text x="44" y="108" font-size="13" fill="#5d6470">1.</text>
<text x="61" y="108" font-size="13">Interview transcripts</text>
<text x="61" y="126" font-size="13">(or other qualitative</text>
<text x="61" y="144" font-size="13">data)</text>
<text x="44" y="165" font-size="13" fill="#5d6470">2.</text>
<text x="61" y="165" font-size="13">Gioia methodology</text>
<text x="61" y="183" font-size="13">papers</text>
<text x="44" y="204" font-size="13" fill="#5d6470">3.</text>
<text x="61" y="204" font-size="13">Research</text>
<text x="61" y="222" font-size="13">background and</text>
<text x="61" y="240" font-size="13">goals</text>
<rect x="226" y="58" width="223" height="200" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="240" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Reasoning model</text>
<text x="240" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">processing loop</text>
<text x="240" y="128" font-size="13">Extract 1st-order concepts.</text>
<text x="240" y="146" font-size="13">Iterate to determine concept</text>
<text x="240" y="164" font-size="13">boundaries and semantic reach.</text>
<text x="240" y="182" font-size="13">Provide a name for each</text>
<text x="240" y="200" font-size="13">concept and a definition. Link all</text>
<text x="240" y="218" font-size="13">related quotes to the concept.</text>
<rect x="479" y="58" width="189" height="200" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="493" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Intermediary</text>
<text x="493" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">output</text>
<text x="493" y="128" font-size="13">A file with each identified</text>
<text x="493" y="146" font-size="13">1st-order concept, related</text>
<text x="493" y="164" font-size="13">quotes from the transcripts</text>
<text x="493" y="182" font-size="13">and concept definitions.</text>
<rect x="30" y="330" width="304" height="178" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="44" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Final output</text>
<text x="44" y="380" font-size="13">A hallucination-free, conceptually clear JSON</text>
<text x="44" y="398" font-size="13">file with all identified 1st-order concepts, their</text>
<text x="44" y="416" font-size="13">definitions and matching quotes.</text>
<rect x="364" y="330" width="304" height="178" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="378" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Merge 1st-order concepts with</text>
<text x="378" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">similar conceptual meaning</text>
<text x="378" y="400" font-size="13">Merge all identical 1st-order concepts with</text>
<text x="378" y="418" font-size="13">similar meaning. A human can control the</text>
<text x="378" y="436" font-size="13">process and how aggressively similar</text>
<text x="378" y="454" font-size="13">concepts are merged.</text>
<rect x="712" y="58" width="258" height="200" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="726" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Hallucination check</text>
<text x="726" y="108" font-size="13">Using Levenshtein distance to check</text>
<text x="726" y="126" font-size="13">whether quotes exist in transcripts.</text>
<rect x="712" y="330" width="258" height="178" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="726" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">Quotes match and leading</text>
<text x="726" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700">questions checks</text>
<text x="726" y="400" font-size="13">A reasoning model goes through each</text>
<text x="726" y="418" font-size="13">quote and re-reads the context in the</text>
<text x="726" y="436" font-size="13">interview to ensure it matches the</text>
<text x="726" y="454" font-size="13">concept. Concepts resulting from</text>
<text x="726" y="472" font-size="13">leading questions are marked for</text>
<text x="726" y="490" font-size="13">human review.</text>
<line x1="196" y1="158" x2="226" y2="158" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="449" y1="158" x2="479" y2="158" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="668" y1="158" x2="712" y2="158" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="841" y1="258" x2="841" y2="330" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="712" y1="419" x2="668" y2="419" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="364" y1="419" x2="334" y2="419" stroke="#16191f" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
